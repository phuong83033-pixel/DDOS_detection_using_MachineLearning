# Deliberately small web server: one worker, few connection slots, short accept queue.
# A real small site behaves like this; it makes the effect of a flood visible in the lab.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    default_type text/html;
    keepalive_timeout 5s;
    sendfile on;

    server {
        listen 80 backlog=64;
        location / {
            root /usr/share/nginx/html;
            index index.html;
            add_header Cache-Control "no-store" always;   # browsers always fetch the current page
        }

        # Live numbers for the status page (open connections, total requests).
        location = /status {
            stub_status;
        }

        # Live security alert status written by the detector container.
        location = /alerts.json {
            alias /results/alert_status.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }
    }
}
